plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}
version = '1.0'
group = 'com.zeroneon.stardewfishingindividualtreasure'
base { archivesName = 'stardew-fishing-individual-treasure' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
repositories { mavenCentral() }
dependencies {
    implementation 'net.neoforged:neoforge:21.1.259'
    compileOnly fileTree(dir: 'libs', include: ['stardew_fishing-3.7-1.21.1.jar'])
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
